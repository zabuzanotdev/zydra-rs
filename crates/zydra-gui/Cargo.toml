[package]
name = "zydra-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
crossbeam-channel.workspace = true
eframe = "0.32.3"
egui = "0.32.3"
rfd = "0.17.2"
zydra-core = { version = "0.1.0", path = "../zydra-core" }
zydra-i18n = { version = "0.1.0", path = "../zydra-i18n" }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true

# Nama binary dikunci eksplisit supaya paket lintas platform stabil:
# `zydra` untuk CLI, `zydra-gui` untuk antarmuka.
[[bin]]
name = "zydra-gui"
path = "src/main.rs"
