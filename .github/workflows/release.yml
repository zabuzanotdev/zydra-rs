name: Rilis

on:
  push:
    tags: ["v*"]

# Diperlukan untuk membuat rilis dan mengunggah berkas ke dalamnya.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bangun:
    name: Bangun (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      # Versi binary datang dari Cargo.toml, bukan dari nama tag. Tanpa pemeriksaan ini,
      # tag dan isi paketnya bisa berbeda dan tidak ada yang menyadarinya sampai pengguna
      # menjalankan --version dan melihat nomor yang salah.
      - name: Periksa versi tag cocok dengan Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag: $tag, Cargo.toml: $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag tidak cocok dengan versi di Cargo.toml ($declared)"
            exit 1
          fi
      - name: Pasang dependensi Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # Paket rilis dipisah CLI vs GUI supaya pengguna awam tidak bingung melihat
      # dua exe dalam satu zip. Lisensi tetap disertakan di tiap paket (wajib GPL).
      - name: Kemas
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"

          ext=""
          if [ "${target}" = "x86_64-pc-windows-msvc" ]; then
            ext=".exe"
          fi

          pack() {
            nama="$1"
            bin="$2"
            mkdir -p "dist/${nama}"
            cp "target/${target}/release/${bin}${ext}" "dist/${nama}/"
            cp LICENSE LICENSE-MIT-Zydra.txt NOTICE README.md "dist/${nama}/"
            cd dist
            if [ "${ext}" = ".exe" ]; then
              powershell -NoProfile -Command "Compress-Archive -Path '${nama}' -DestinationPath '${nama}.zip'"
            else
              tar czf "${nama}.tar.gz" "${nama}"
            fi
            cd ..
          }

          pack "zydra-cli-${target}" "zydra"
          pack "zydra-gui-${target}" "zydra-gui"

          ls -l dist

      - name: Simpan paket
        uses: actions/upload-artifact@v4
        with:
          name: zydra-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  rilis:
    name: Terbitkan
    needs: bangun
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Daftar paket
        run: ls -l dist

      - name: Buat rilis
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
